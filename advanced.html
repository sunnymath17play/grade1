<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUNNY 魔法數學 · 一年級期中進階挑戰</title>
<link rel="icon" href="logo.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --orange:#F5820A; --gold:#F9A81B; --yellow:#FBC02D;
    --deep:#E8590C; --brown:#4A3728; --cream:#FFF8ED;
    --green:#43A047; --red:#E53935; --blue:#1E88E5;
  }
  html,body{height:100%;}
  body{
    font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(160deg,#FFF3D9 0%,#FFE4B8 100%);
    color:var(--brown); user-select:none; touch-action:manipulation;
  }
  #app{ max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
  .screen{ flex:1; display:none; flex-direction:column; padding:16px; }
  .screen.active{ display:flex; }
  button{ font-family:inherit; color:inherit; border:none; cursor:pointer; }

  .brand{ display:flex; align-items:center; justify-content:center; gap:10px; padding:4px 0; }
  .sun{ width:44px; height:44px; overflow:hidden; flex:none; }
  .sun img{ width:111px; margin:-28px 0 0 0; display:block; }
  .brand .txt{ font-weight:800; font-size:20px; color:var(--deep); letter-spacing:1px; }
  .brand .txt small{ display:block; font-size:12px; color:var(--gold); font-weight:700; letter-spacing:3px; }

  /* ---- Home ---- */
  .home-title{ text-align:center; margin:10px 0 4px; font-size:34px; font-weight:900; color:var(--deep);
    text-shadow:2px 2px 0 #fff, 3px 3px 0 rgba(245,130,10,.25); }
  .home-sub{ text-align:center; font-size:15px; color:#B0742A; margin-bottom:14px; font-weight:600; }
  .all-card{ background:linear-gradient(135deg,#F9A81B,#F5820A); color:#fff; border-radius:22px; padding:18px;
    font-size:24px; font-weight:900; text-align:center; box-shadow:0 6px 0 #C9620A; margin:0 4px 14px; }
  .all-card:active{ transform:translateY(3px); box-shadow:0 3px 0 #C9620A; }
  .lv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 4px; }
  .lv-card{ background:#fff; border-radius:18px; padding:12px 10px; text-align:center; position:relative;
    box-shadow:0 5px 0 rgba(245,130,10,.18), 0 6px 14px rgba(0,0,0,.05); border:3px solid var(--gold); }
  .lv-card:active{ transform:scale(.97); }
  .lv-card .em{ font-size:34px; }
  .lv-card .nm{ font-size:18px; font-weight:800; margin-top:2px; }
  .lv-card .no{ position:absolute; top:6px; left:10px; font-size:12px; color:#B0742A; font-weight:700; }
  .lv-card .ok{ position:absolute; top:4px; right:8px; font-size:16px; }
  .adult-btn{ margin:18px 4px 8px; text-align:center; padding:13px; background:rgba(255,255,255,.75);
    border-radius:16px; font-weight:700; color:var(--deep); font-size:15px; }

  /* ---- Game ---- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .topbar .home{ background:#fff; border-radius:14px; padding:10px 14px; font-size:20px; font-weight:900; color:var(--deep); border:3px solid var(--gold); box-shadow:0 4px 0 rgba(245,130,10,.25); white-space:nowrap; flex:none; }
  .topbar .home .ic{ font-size:26px; vertical-align:middle; }
  .topbar .lvname{ font-weight:900; font-size:18px; color:var(--deep); }
  .dots{ display:flex; gap:6px; }
  .dots span{ width:12px; height:12px; border-radius:50%; background:#fff; border:2px solid var(--gold); }
  .dots span.done{ background:var(--gold); }
  .prompt{ display:flex; align-items:flex-start; gap:10px; background:#fff; border-radius:18px; padding:14px;
    margin:12px 0 10px; font-size:22px; font-weight:800; line-height:1.45; box-shadow:0 4px 0 rgba(245,130,10,.15); }
  .prompt .spk{ flex:none; font-size:24px; background:var(--cream); border-radius:12px; width:44px; height:44px; }
  .visual{ display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom:10px; }
  .opts{ display:grid; gap:10px; }
  .opt{ background:#fff; border-radius:16px; min-height:60px; font-size:30px; font-weight:900; color:var(--brown);
    box-shadow:0 5px 0 rgba(30,136,229,.35); border:3px solid #BBDEFB; transition:opacity .2s; }
  .opt:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(30,136,229,.35); }
  .opt.tried{ opacity:.35; pointer-events:none; }
  .opt.right{ border-color:var(--green); background:#E8F5E9; animation:pop .5s; }
  @keyframes pop{ 50%{ transform:scale(1.12);} }
  .feedback{ text-align:center; font-size:22px; font-weight:900; min-height:36px; margin-top:12px; }
  .feedback.good{ color:var(--green); } .feedback.soft{ color:var(--orange); } .feedback.show{ color:var(--blue); }
  .lock .opts, .lock .take-btns{ pointer-events:none; }

  /* count box */
  .countbox{ position:relative; width:300px; height:200px; background:#fff; border-radius:18px; border:3px dashed var(--gold); }
  .countbox span{ position:absolute; font-size:34px; line-height:1; }
  /* number row */
  .numrow{ display:flex; gap:8px; }
  .numrow div{ width:52px; height:58px; border-radius:12px; background:#fff; border:3px solid var(--gold);
    font-size:30px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .numrow div.q{ border-color:var(--blue); color:var(--blue); background:#E3F2FD; }
  .bignum{ font-size:64px; font-weight:900; color:var(--deep); line-height:1; }
  /* take */
  .take{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  .plate{ width:300px; min-height:130px; border-radius:50%/40%; background:#fff; border:5px solid #FFE0B2;
    display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:2px; padding:16px 30px; font-size:32px; }
  .take-btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
  .take-btns .jar{ grid-column:1/3; font-size:24px; }
  .take-btns button{ min-height:58px; border-radius:16px; font-size:20px; font-weight:800; background:#fff;
    border:3px solid #BBDEFB; box-shadow:0 5px 0 rgba(30,136,229,.35); }
  .take-btns .okb{ background:var(--green); color:#fff; border-color:var(--green); box-shadow:0 5px 0 #2E7D32; }
  /* ordinal */
  .sides{ display:flex; justify-content:space-between; width:100%; font-size:16px; font-weight:800; color:#B0742A; margin-bottom:6px; }
  .ord .opts{ grid-template-columns:repeat(7,1fr) !important; gap:4px; }
  .ord .opt{ font-size:30px; min-height:58px; padding:0; }
  /* compare rows */
  .rows{ background:#fff; border-radius:16px; padding:10px; }
  .rows .r{ display:grid; grid-template-columns:repeat(10,28px); gap:2px; font-size:24px; text-align:center; min-height:34px; }
  /* beans */
  .beanstage{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; background:#fff;
    border-radius:18px; padding:14px; width:300px; min-height:110px; }
  .bean{ width:26px; height:20px; border-radius:50%; background:#8D5524; box-shadow:inset -3px -3px 0 rgba(0,0,0,.2); }
  .cup{ width:86px; height:76px; background:linear-gradient(#EF6C00,#F9A81B); clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);
    color:#fff; font-size:38px; font-weight:900; display:flex; align-items:center; justify-content:center; animation:drop .5s; }
  @keyframes drop{ from{ transform:translateY(-60px); opacity:0;} }
  .bond{ margin-top:10px; font-size:22px; font-weight:800; }
  .bond b{ color:var(--deep); font-size:28px; }
  .bond .box{ display:inline-block; width:38px; height:38px; border:3px solid var(--blue); border-radius:8px; vertical-align:middle; }
  /* length */
  .bar{ height:26px; border-radius:6px 14px 14px 6px; }
  .lenopt{ display:flex; align-items:center; gap:10px; padding:10px 12px; min-height:56px; font-size:18px; }
  .lenopt .lbl{ width:30px; flex:none; }
  .fair{ display:flex; flex-direction:column; gap:8px; padding:14px; font-size:20px; }
  .fair .bar{ height:20px; }
  /* shapes */
  .shapes .opt{ font-size:48px; min-height:90px; }

  /* ---- 教學 ---- */
  .teach{ background:#fff; border-radius:18px; padding:12px; border:3px solid var(--green); }
  .t-title{ font-size:18px; font-weight:900; color:var(--green); margin-bottom:8px; }
  .t-vis{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .t-say{ margin-top:12px; font-size:22px; font-weight:800; text-align:center; min-height:64px; line-height:1.45; }
  .t-say b{ color:var(--deep); }
  .t-btns{ display:grid; grid-template-columns:1fr 1.4fr; gap:10px; margin-top:12px; }
  .t-btns button{ min-height:58px; border-radius:16px; font-size:19px; font-weight:900; background:#fff; border:3px solid #BBDEFB; box-shadow:0 5px 0 rgba(30,136,229,.35); }
  .t-btns #tNext{ background:var(--green); color:#fff; border-color:var(--green); box-shadow:0 5px 0 #2E7D32; }
  .rel{ position:relative; }
  .badge{ position:absolute; top:-8px; right:-8px; min-width:22px; height:22px; padding:0 4px; border-radius:11px; background:var(--deep); color:#fff;
    font-size:14px; font-style:normal; font-weight:900; line-height:22px; text-align:center; font-family:Arial,sans-serif; animation:pop .4s; }
  .lit{ filter:drop-shadow(0 0 5px #F9A81B); }
  .ans{ outline:4px solid var(--green); outline-offset:3px; border-radius:10px; animation:pop .5s; }
  .numrow div.lit{ background:#FFF3D9; border-color:var(--orange); }
  .numrow div.ans{ color:var(--green); border-color:var(--green); background:#E8F5E9; }
  .numrow.small{ gap:4px; } .numrow.small div{ width:28px; height:40px; font-size:18px; border-width:2px; border-radius:8px; }
  .numrow div.mk1{ background:#FFE0B2; } .numrow div.mk2{ background:#BBDEFB; }
  .ordrow{ display:flex; gap:4px; font-size:27px; } .ordrow span{ padding:2px; }
  .sides span.sidelit{ color:#fff; background:var(--deep); border-radius:8px; padding:2px 8px; animation:pop .5s; }
  .rows .r span{ border-radius:6px; } .rows .r span.pair{ background:#ECEFF1; } .rows .r span.lit{ background:#FFF3D9; }
  .bean.hidb{ background:#F57C00; } .hidc{ color:#F57C00 !important; } .gap{ width:14px; }
  .lenbox{ position:relative; display:flex; flex-direction:column; gap:12px; padding:8px 0; width:290px; }
  .lenbox .tbar{ color:#fff; font-size:15px; font-weight:900; padding-left:8px; line-height:26px; transition:opacity .4s; }
  .lenbox .tbar.fade{ opacity:.25; }
  .startline{ position:absolute; left:-3px; top:0; bottom:0; border-left:3px dashed transparent; }
  .startline.on{ border-color:var(--green); }
  .tcard{ border:3px solid #E0E0E0; border-radius:14px; width:100%; } .tcard.bad{ border-color:#FFCDD2; }
  .tcard .mv{ transition:margin-left .8s; }
  .shapecards{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:100%; }
  .scard{ border:2px solid #FFE0B2; border-radius:12px; padding:6px 4px; text-align:center; font-size:13px; line-height:1.35; }
  .scard .se{ font-size:40px; } .scard b{ font-size:16px; display:block; }
  .roll{ display:inline-block; animation:roll 1.2s ease-in-out 2; }
  @keyframes roll{ 50%{ transform:translateX(18px) rotate(360deg);} }

  /* ---- v8 新題型 ---- */
  .vlabel{ font-size:16px; font-weight:800; color:#B0742A; text-align:center; margin:4px 0; }
  .vlabel.sidelit{ color:#fff; background:var(--deep); border-radius:8px; padding:2px 10px; display:inline-block; }
  .vert .opts{ max-width:110px; margin:0 auto; gap:6px; } .vert .opt{ min-height:52px; font-size:30px; }
  .ordcol{ display:flex; flex-direction:column; gap:4px; font-size:30px; } .ordcol span{ padding:0 6px; }
  .vbox{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:4px; min-height:160px; font-size:15px; }
  .vbar{ width:36px; border-radius:14px 14px 4px 4px; transition:opacity .4s; } .vbar.fade{ opacity:.25; }
  .vbars{ display:flex; gap:22px; align-items:flex-end; justify-content:center; }
  .ground{ height:4px; background:#BDBDBD; border-radius:2px; width:100%; } .ground.on{ background:var(--green); width:260px; }
  .tcardT{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px; font-size:20px; border:3px solid transparent; border-radius:12px; }
  .tcardT.bad{ border-color:#FFCDD2; }
  .vpair{ display:flex; gap:12px; align-items:flex-end; height:160px; }
  .vcol{ display:flex; flex-direction:column; align-items:center; }
  .step{ width:52px; background:#8D6E63; border-radius:4px; transition:height .8s; }
  .tpair{ display:flex; gap:10px; justify-content:center; }
  .book{ width:200px; border-radius:4px 10px 10px 4px; box-shadow:inset 0 -3px 0 rgba(255,255,255,.35); transition:opacity .4s; flex:none; }
  .book.fade{ opacity:.25; }
  .bookstack{ display:flex; flex-direction:column; gap:10px; } .bookrow{ display:flex; align-items:center; gap:10px; font-weight:800; }
  .linelist{ display:flex; flex-direction:column; gap:8px; } .lrow{ display:flex; align-items:center; gap:12px; font-size:20px; padding:2px 6px; }
  .nthrow{ display:flex; gap:3px; justify-content:center; }
  .nth{ font-size:24px; padding:5px 1px; min-width:0; border-radius:10px; background:#fff; border:3px solid #E0E0E0; }
  .nth.on{ background:#FFE082; border-color:var(--orange); }
  .enough{ display:flex; flex-direction:column; gap:14px; background:#fff; border-radius:16px; padding:12px; width:300px; }
  .enough .er1{ display:flex; gap:14px; flex-wrap:wrap; font-size:28px; } .enough .er2{ display:flex; gap:4px; flex-wrap:wrap; font-size:30px; justify-content:flex-end; }

  /* ---- 全對收集＋通關證書 ---- */
  .collect{ margin:0 4px 12px; background:#fff; border-radius:16px; padding:10px 14px; box-shadow:0 4px 0 rgba(245,130,10,.15); }
  .collect-txt{ font-size:17px; font-weight:900; color:var(--deep); text-align:center; }
  .collect-bar{ height:14px; background:#FFE0B2; border-radius:7px; margin-top:6px; overflow:hidden; }
  .collect-bar div{ height:100%; background:linear-gradient(90deg,#F9A81B,#E53935); border-radius:7px; transition:width .6s; }
  .collect-end{ color:var(--deep) !important; font-weight:900 !important; }
  .grand-btn{ width:100%; max-width:340px; margin:0 auto 12px; display:block; padding:16px; border-radius:18px; font-size:22px; font-weight:900;
    color:#fff; background:linear-gradient(135deg,#E53935,#F5820A); box-shadow:0 5px 0 #B71C1C; animation:pop 1.2s infinite; }
  .cert.grand .cert-title{ font-size:38px; letter-spacing:4px; }
  .cert.grand.hasimg{ background-image:url(cert_grand.jpg); }
  .confetti{ font-size:30px; letter-spacing:6px; animation:pop 1s infinite; }

  /* ---- Level end ---- */
  .end-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
  .end-wrap .stars{ font-size:56px; animation:pop .8s; }
  .end-wrap h2{ font-size:30px; color:var(--deep); }
  .end-wrap p{ font-size:18px; color:#9A6B3A; font-weight:700; }
  /* 獎狀：有 cert.png（阿居畫的底圖）就用圖，沒有就用 CSS 框 */
  .cert{ width:100%; max-width:340px; aspect-ratio:2/3; border-radius:14px; position:relative; animation:pop .8s;
    background:#FFF8ED; border:10px double var(--gold); box-shadow:0 0 0 4px var(--orange), 0 10px 24px rgba(0,0,0,.15); }
  .cert.hasimg{ background:url(cert.jpg) center/100% 100% no-repeat; border:none; box-shadow:0 10px 24px rgba(0,0,0,.15); }
  .cert-in{ position:absolute; inset:20% 14% 16%; display:flex; flex-direction:column; align-items:center; justify-content:space-between; text-align:center; }
  .cert-title{ font-size:44px; font-weight:900; color:#C62828; letter-spacing:6px; }
  .cert-who{ font-size:24px; font-weight:900; color:var(--brown); border-bottom:3px solid var(--gold); padding:0 10px 2px; }
  .cert-body{ font-size:21px; font-weight:800; color:var(--brown); line-height:1.6; } .cert-body b{ color:var(--deep); }
  .cert-gift{ font-size:17px; font-weight:900; color:var(--green); }
  .cert-foot{ position:absolute; left:0; right:0; bottom:5%; text-align:center; font-size:13px; color:#9A6B3A; font-weight:700; line-height:1.5; }
  .cert.hasimg .cert-in{ inset:17% 13% 31%; }
  .cert.hasimg .cert-foot{ left:13%; right:auto; top:73.5%; bottom:auto; text-align:left; font-size:12px; }
  .big-btn{ width:100%; max-width:340px; padding:16px; border-radius:18px; font-size:22px; font-weight:900;
    background:linear-gradient(135deg,#F9A81B,#F5820A); color:#fff; box-shadow:0 5px 0 #C9620A; }
  .big-btn.ghost{ background:#fff; color:var(--deep); box-shadow:0 5px 0 rgba(245,130,10,.25); }

  /* ---- Report (給大人) ---- */
  #report{ background:#fff; padding:12px; }
  .rp-head{ display:flex; align-items:center; gap:8px; border-bottom:3px solid var(--gold); padding-bottom:6px; }
  .rp-head .sun{ width:36px; height:36px; } .rp-head .sun img{ width:91px; margin:-23px 0 0 0; }
  .rp-head h2{ font-size:17px; color:var(--deep); line-height:1.25; }
  .rp-head h2 small{ display:block; font-size:12px; color:#9A8570; font-weight:600; }
  table.rp{ width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
  table.rp th{ white-space:nowrap; background:#FFF3D9; font-size:12px; padding:4px 3px; text-align:left; }
  table.rp td{ border-bottom:1px solid #F3E2C7; padding:3px 3px; vertical-align:top; line-height:1.35; }
  table.rp td.st{ font-size:14px; white-space:nowrap; font-weight:800; width:22px; }
  .rp-legend{ font-size:11px; color:#9A8570; margin-top:6px; }
  table.rp td.sc{ white-space:nowrap; font-weight:800; text-align:center; }
  table.rp td .u{ color:#9A8570; font-size:10px; margin-right:3px; }
  table.rp td.wr{ font-size:11px; color:#6D4C41; }
  tr.s-ok td.st{ color:var(--green); } tr.s-mid td.st{ color:#EF6C00; } tr.s-bad td.st{ color:var(--red); }
  tr.s-none td{ color:#BDBDBD; }
  .rp-focus{ margin-top:10px; background:#FFF8E1; border-left:5px solid var(--orange); border-radius:8px; padding:8px 10px; font-size:14px; line-height:1.5; }
  .rp-focus b{ color:var(--deep); }
  .rp-note{ margin-top:6px; font-size:12px; color:#9A8570; text-align:center; }
  .rp-actions{ display:flex; gap:8px; margin-top:14px; }
  .rp-actions button{ flex:1; padding:12px; border-radius:12px; font-weight:800; font-size:15px; background:#FFF3D9; color:var(--deep); }
  .hist{ margin-top:12px; font-size:13px; }
  .hist div{ padding:7px 8px; border-radius:8px; background:#FAFAFA; margin-top:4px; }
  .hist div.cur{ background:#FFF3D9; font-weight:800; }

  /* ---- 進階挑戰 ---- */
  .adv-title{ color:#C62828; }
  .countbox span.dim{ opacity:.18; }
  .countbox.findbox{ width:350px; height:276px; } .countbox.findbox span{ font-size:50px; }
  .teach .countbox.findbox{ transform:scale(.87); transform-origin:top center; margin-bottom:-36px; }
  .fixbox{ display:flex; align-items:center; gap:12px; background:#fff; border-radius:16px; padding:10px 12px; width:310px; }
  .ncard{ flex:none; width:58px; height:68px; border-radius:12px; background:#E3F2FD; border:3px solid var(--blue); font-size:40px; font-weight:900; color:var(--blue); display:flex; align-items:center; justify-content:center; }
  .fixitems{ display:flex; flex-wrap:wrap; gap:2px; font-size:28px; } .fixitems .empty{ font-size:16px; color:#9A8570; }
  .basket{ background:#FFF8ED; border:3px solid #E0C9A6; border-radius:12px 12px 22px 22px; padding:4px; width:100%; display:flex; flex-direction:column; gap:3px; margin-top:2px; }
  .brow{ font-size:15px; line-height:1.25; letter-spacing:-1px; text-align:left; min-height:19px; word-break:break-all; }
  .brow .bn{ visibility:hidden; font-style:normal; color:#fff; background:var(--deep); border-radius:8px; font-size:12px; padding:0 5px; margin-left:3px; letter-spacing:0; }
  .need{ font-size:20px; font-weight:900; background:#FFF3D9; border-radius:12px; padding:6px 10px; }
  .bkts{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:100%; text-align:center; }
  .basket.bad{ border-color:#EF9A9A; opacity:.55; } .basket.look{ border-color:var(--orange); }
  .stepwrap{ position:relative; display:flex; gap:26px; align-items:flex-end; justify-content:center; height:230px; border-bottom:4px solid #BDBDBD; width:280px; background:#fff; border-radius:14px 14px 0 0; }
  .headline{ position:absolute; left:6px; right:6px; top:70px; border-top:3px dashed #1E88E5; }
  .scol{ display:flex; flex-direction:column; align-items:center; transition:opacity .4s; }
  .sface{ font-size:36px; line-height:40px; height:40px; display:block; border-radius:10px; }
  .sbody{ width:40px; border-radius:10px 10px 4px 4px; }

  .plate2{ font-size:28px; background:#fff; border-radius:50%/40%; border:5px solid #FFE0B2; padding:8px 24px; min-width:200px; text-align:center; margin-bottom:8px; }
  .bondbox{ display:flex; flex-direction:column; align-items:center; }
  .bpart{ display:flex; gap:28px; } .blab{ display:flex; gap:28px; font-size:14px; font-weight:800; color:#B0742A; } .blab span{ width:56px; text-align:center; }
  .bb{ width:56px; height:56px; border:3px solid var(--blue); border-radius:10px; background:#fff; font-size:32px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .bb.q{ color:var(--deep); border-color:var(--deep); background:#FFF3D9; }
  .dotrow{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:300px; margin-bottom:8px; }
  .dot{ width:26px; height:26px; border-radius:50%; position:relative; }

  .rings{ display:flex; gap:16px; justify-content:center; }
  .rcol{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .rlab{ font-weight:900; color:var(--deep); background:#FFF3D9; border-radius:10px; padding:2px 10px; }
  .ring{ width:132px; height:76px; border:6px solid #64B5F6; border-radius:50%; display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:2px; font-size:20px; background:#fff; padding:0 14px; }
  .ring span, .outb span{ position:relative; } .outb{ display:flex; gap:4px; font-size:20px; min-height:28px; }
  .tenf{ display:grid; grid-template-columns:repeat(5,48px); gap:4px; background:#fff; padding:6px; border-radius:12px; }
  .tenf div{ height:48px; border:2px dashed #FFB74D; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:30px; position:relative; }
  .tenf div.f{ border-style:solid; border-color:#E0E0E0; }
  .solid{ background:#fff; border-radius:16px; padding:6px 20px; }
  .shrow{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .shc{ background:#fff; border:2px solid #FFE0B2; border-radius:12px; padding:6px; text-align:center; font-size:14px; font-weight:800; max-width:110px; transition:opacity .4s; }
  .adv-link{ display:block; text-decoration:none; }

<script>
/* ========== 小工具 ========== */
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (arr,n) => shuffle(arr).slice(0,n);
const range = (a,b) => Array.from({length:b-a+1},(_,i)=>a+i);

/* 語音唸題 */
let zhVoice = null;
function loadVoice(){
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh[-_]HK/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(t){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'zh-TW'; if(zhVoice) u.voice = zhVoice; u.rate = 0.75;
  speechSynthesis.speak(u);
}
/* 答對小鈴聲（答錯不出聲） */
let actx=null;
function chime(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [880,1320].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=f; o.type='sine'; o.connect(g); g.connect(actx.destination);
      const t=actx.currentTime+i*0.12; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.35);
      o.start(t); o.stop(t+.4);
    });
  }catch(e){}
}

/* ========== 紀錄（只存在這台裝置） ========== */
const KEY='g1adv_sessions';
function loadAll(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function saveAll(a){ try{ localStorage.setItem(KEY, JSON.stringify(a.slice(-20))); }catch(e){} }
let sessions = loadAll();
let cur = null;               // 目前這一次測驗
function newSession(){ cur = { start: Date.now(), levels:{} }; sessions.push(cur); saveAll(sessions); }
function ensureSession(){
  // 3 小時內接著玩算同一次
  const last = sessions[sessions.length-1];
  if(last && Date.now()-last.start < 3*3600*1000){ cur = last; } else newSession();
}
ensureSession();

const BKEY='g1adv_badges';
let badges=(()=>{ try{ return JSON.parse(localStorage.getItem(BKEY))||{}; }catch(e){ return {}; } })();
function saveBadges(){ try{ localStorage.setItem(BKEY, JSON.stringify(badges)); }catch(e){} }
// 以前紀錄裡拿過的單關獎狀也算進來
sessions.forEach(x=>Object.keys(x.levels||{}).forEach(id=>{ if(x.levels[id].cert && !badges[id]) badges[id]=x.start; }));
saveBadges();

/* ========== 題目產生 ========== */
const FRUITS=['🍎','🍓','🍊','🍌','🍇','🍒','🍐','🍋'];
const ANIMALS=['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧'];
const NUMS = (a,b)=>range(a,b).map(n=>({label:n,value:n}));

function genCount(){
  const n=rnd(1,10), em=pick(FRUITS);
  const cells=sample(range(0,19),n).sort((x,y)=>x-y);
  const pos=cells.map(c=>[12+(c%5)*56+rnd(-6,6), 8+Math.floor(c/5)*47+rnd(-4,4)]);
  const items=pos.map(([x,y])=>`<span style="left:${x}px;top:${y}px">${em}</span>`).join('');
  return { prompt:`數一數，有幾個 ${em}？`, speech:'鼠一鼠，有幾個？',
    visual:`<div class="countbox">${items}</div>`, t:{type:'count',em,pos,n},
    options:NUMS(1,10), cols:5, answer:n,
    detail:v=>`${n}個 答${v}${Math.abs(v-n)===1?'（差1，可能漏數或重複數）':''}` };
}

function genTake(){
  const n=rnd(3,10), em=pick(['🍪','🍬','🍩','🧁']);
  return { prompt:`請放 <b style="color:#E8590C;font-size:30px">${n}</b> 個 ${em} 到盤子裡`, speech:`請放${n}個到盤子裡，放好了按好了`,
    custom:true, answer:n, em, t:{type:'take',em,n},
    detail:v=>`要${n}個 拿了${v}個` };
}
function buildTake(q, area, submit){
  let cnt=0;
  area.innerHTML=`<div class="take"><div class="plate" id="plate"></div>
    <div class="take-btns"><button class="jar" id="tkAdd">${q.em} 點我放一個</button>
    <button id="tkUndo">↩ 拿回一個</button><button class="okb" id="tkOk">✅ 好了</button></div></div>`;
  const plate=$('plate');
  const draw=()=>{ plate.innerHTML = Array(cnt).fill(`<span>${q.em}</span>`).join(''); };
  $('tkAdd').onclick=()=>{ if(cnt<15){ cnt++; draw(); } };
  $('tkUndo').onclick=()=>{ if(cnt>0){ cnt--; draw(); } };
  $('tkOk').onclick=()=>submit(cnt);
  q.showAnswer=()=>{ cnt=q.answer; draw(); };
}

function genSeq(kind){
  if(kind==='nb'){
    const x=rnd(2,9), after=Math.random()<.5, ans=after?x+1:x-1;
    return { prompt:`<b style="color:#E8590C">${x}</b> 的${after?'後面':'前面'}是哪個數字？`, speech:`${x}的${after?'後面':'前面'}是哪個數字？`,
      visual:'', options:NUMS(1,10), cols:5, answer:ans, t:{type:'nb',x,after},
      detail:v=>`${x}的${after?'後面':'前面'} 答${v}${v===(after?x-1:x+1)?'（前後搞反）':''}` };
  }
  if(kind==='cmp'){
    let a=rnd(1,10), b; do{ b=rnd(1,10); }while(b===a);
    const big = Math.random()<.6;
    const ans = big ? Math.max(a,b) : Math.min(a,b);
    return { prompt:`哪一個比較<b style="color:#E8590C">${big?'大':'小'}</b>？`, speech:`哪一個數字比較${big?'大':'小'}？`,
      visual:'', options:[{label:a,value:a},{label:b,value:b}], cols:2, big:true, answer:ans, t:{type:'cmp',a,b,big},
      detail:v=>`${a}和${b}比較${big?'大':'小'} 答${v}` };
  }
  const down = Math.random()<.3;
  const s = rnd(1,6); let seq = range(s,s+4); if(down) seq.reverse();
  const hole = rnd(0,4), ans = seq[hole];
  const show = seq.map((x,i)=>i===hole?'?':x);
  return { prompt:`數字排隊，<b style="color:#1E88E5">?</b> 是多少？`, speech:'數字排隊，問號是多少？',
    visual:`<div class="numrow">${show.map(x=>`<div class="${x==='?'?'q':''}">${x}</div>`).join('')}</div>`,
    options:NUMS(1,10), cols:5, answer:ans, t:{type:'seq',seq,hole,down},
    detail:v=>`${show.join(' ')} 答${v}${down?'（倒著數）':''}` };
}

function genOrd(){
  const row=sample(ANIMALS,7), fromLeft=Math.random()<.5, k=rnd(2,6);
  const idx = fromLeft ? k-1 : 7-k;                 // 從左邊數的位置（0 起算）
  const side = fromLeft?'左':'右';
  return { prompt:`從<b style="color:#E8590C">${side}邊</b>數起，第 <b style="color:#E8590C">${k}</b> 個是誰？`,
    speech:`從${side}邊鼠起，第${k}個是誰？`, ord:true,
    visual:`<div class="sides"><span>⬅ 左邊</span><span>右邊 ➡</span></div>`,
    options:row.map((a,i)=>({label:a,value:i})), cols:7, answer:idx, t:{type:'ord',row,fromLeft,k,idx},
    detail:v=>{ const mirror = 6-idx; let tag='';
      if(v===mirror) tag='（左右搞反）'; else if(Math.abs(v-idx)===1) tag='（差一個）';
      return `從${side}數第${k}個 點到${row[v]}${tag}`; } };
}

function genOrdV(){
  const col=sample(ANIMALS,6), fromTop=Math.random()<.5, k=rnd(2,5);
  const idx = fromTop ? k-1 : 6-k;                  // 從上面數的位置（0 起算）
  const side = fromTop?'上':'下', dir = fromTop?'從上往下':'從下往上';
  return { prompt:`<b style="color:#E8590C">${dir}</b>數，第 <b style="color:#E8590C">${k}</b> 個是誰？`,
    speech:`${dir}鼠，第${k}個是誰？`, vert:true,
    visual:`<div class="vlabel">⬆ 上面</div>`, after:`<div class="vlabel">⬇ 下面</div>`,
    options:col.map((a,i)=>({label:a,value:i})), cols:1, answer:idx, t:{type:'ordv',col,fromTop,k,idx},
    detail:v=>{ let tag=''; if(v===5-idx) tag='（上下搞反）'; else if(Math.abs(v-idx)===1) tag='（差一個）';
      return `${dir}數第${k}個 點到${col[v]}${tag}`; } };
}

const PAIRS=[['🐰','🥕','兔子','紅蘿蔔'],['🐶','🦴','小狗','骨頭'],['🐵','🍌','猴子','香蕉'],['🐱','🐟','小貓','魚'],['🐔','🥚','雞','蛋']];

function genMore(kind,equal){
  const [e1,e2,n1,n2]=pick(PAIRS);
  let a=rnd(3,10), b; do{ b=rnd(2,10); }while(b===a || Math.abs(a-b)>4);
  const rowsHtml=`<div class="rows"><div class="r">${Array(a).fill(`<span>${e1}</span>`).join('')}</div><div class="r">${Array(b).fill(`<span>${e2}</span>`).join('')}</div></div>`;
  if(kind==='which'){
    if(equal){ a=b=rnd(3,9); }
    const less = Math.random()<.4;
    const rowsEq=`<div class="rows"><div class="r">${Array(a).fill(`<span>${e1}</span>`).join('')}</div><div class="r">${Array(b).fill(`<span>${e2}</span>`).join('')}</div></div>`;
    const ans = a===b ? 'eq' : ((a>b)!==less ? e1 : e2);
    return { prompt:`${e1} 和 ${e2}，哪一種比較<b style="color:#E8590C">${less?'少':'多'}</b>？`, speech:`${n1}和${n2}，哪一種比較${less?'少':'多'}？`,
      visual:rowsEq, options:[{label:e1,value:e1},{label:e2,value:e2},{label:'一樣多',value:'eq',html:true}], cols:3, big:true, answer:ans,
      t:{type:'more',kind,less,e1,e2,n1,n2,a,b},
      detail:v=>`${e1}${a}個 ${e2}${b}個 問比較${less?'少':'多'} 選${v==='eq'?'一樣多':v}` };
  }
  const [bigE,smE,bigN,smN,bigC,smC] = a>b?[e1,e2,n1,n2,a,b]:[e2,e1,n2,n1,b,a];
  const ans=bigC-smC;
  return { prompt:`${bigE} 比 ${smE} 多幾個？`, speech:`${bigN}比${smN}多幾個？`,
    visual:rowsHtml, options:NUMS(1,10), cols:5, answer:ans, t:{type:'more',kind,e1,e2,n1,n2,a,b},
    detail:v=>`${bigE}${bigC} ${smE}${smC} 多幾個 答${v}${v===bigC?'（答成總數）':''}` };
}

function genBean(){
  const n=rnd(5,10), hid=rnd(1,n-1), out=n-hid;
  return { prompt:`總共 <b style="color:#E8590C">${n}</b> 顆豆子，杯子裡藏了幾顆？`,
    speech:`這裡有${n}顆豆子。我用杯子蓋住一些。杯子外面還有${out}顆，杯子裡面藏了幾顆？`,
    bean:{n,out}, options:NUMS(1,9), cols:5, answer:hid, t:{type:'bean',n,out,hid},
    detail:v=>`${n}＝${out}＋□ 答${v}${v===out?'（答成外面的）':v===n?'（答成總數）':''}` };
}
function buildBean(q, area, ready){
  const {n,out}=q.bean;
  const stage=document.createElement('div'); stage.className='beanstage';
  stage.innerHTML = Array(n).fill('<div class="bean"></div>').join('');
  const bond=document.createElement('div'); bond.className='bond';
  bond.innerHTML=`<b>${n}</b> 可以分成 <b>${out}</b> 和 <span class="box"></span>`; bond.style.visibility='hidden';
  area.prepend(bond); area.prepend(stage);
  setTimeout(()=>{
    stage.innerHTML = `<div class="cup">?</div>` + Array(out).fill('<div class="bean"></div>').join('');
    bond.style.visibility='visible'; ready();
  }, 2600);
}

const COLORS=[['#E53935','紅'],['#1E88E5','藍'],['#43A047','綠']];
function genLen(kind){
  if(kind==='fair'){
    const fairFirst=Math.random()<.5;
    const card=(aligned,lab)=>{ const off = aligned?0:rnd(25,35);
      return `<div class="fair"><b>${lab}</b><div class="bar" style="width:80%;background:#E53935"></div>
        <div class="bar" style="width:62%;margin-left:${off}%;background:#1E88E5"></div></div>`; };
    const A=card(fairFirst,'Ａ'), B=card(!fairFirst,'Ｂ');
    return { prompt:'比長短，哪一種比法才<b style="color:#E8590C">公平</b>？', speech:'比長短，哪一種比法才公平？',
      visual:'', options:[{label:A,value:'A',html:true},{label:B,value:'B',html:true}], cols:1, answer:fairFirst?'A':'B', t:{type:'fair',fairFirst},
      detail:v=>`公平比法（一端對齊）選了沒對齊的那個` };
  }
  const lens=sample(range(3,10),3), long=Math.random()<.6;
  const target = long ? lens.indexOf(Math.max(...lens)) : lens.indexOf(Math.min(...lens));
  return { prompt:`哪一條最<b style="color:#E8590C">${long?'長':'短'}</b>？`, speech:`哪一條最${long?'長':'短'}？`,
    visual:'', len:true,
    options:lens.map((L,i)=>({label:`<span class="lbl">${COLORS[i][1]}</span><div class="bar" style="width:${L*24}px;background:${COLORS[i][0]}"></div>`,value:i,html:true})),
    cols:1, answer:target, t:{type:'len',lens,target,long},

function genFix(){
  const em=pick(FIX_EM), r=Math.random(); let kind=r<.15?'eq':(r<.575?'add':'cut'), d=rnd(1,4), N, k;
  if(kind==='eq'){ N=rnd(2,9); k=N; d=0; } else if(kind==='add'){ N=rnd(d,10); k=N-d; } else { N=rnd(0,10-d); k=N+d; }

/* 14 數形狀：形狀組成的火車 */
const SHN={ci:'圓形',tri:'三角形',sq:'正方形',rect:'長方形'};
const SHAPE_HINT={ci:'<b>圓形</b>圓圓的，車輪、煙都是圓形',tri:'<b>三角形</b>有 3 個尖尖的角',sq:'<b>正方形</b>：4 個邊一樣長',rect:'<b>長方形</b>長長的：兩個邊長、兩個邊短'};
function genTrain(){
  const els=[], add=(k,svg)=>els.push({k,svg}), cars=rnd(1,2);
  add('rect','<rect x="10" y="95" width="80" height="36" fill="#EF9A9A"/>');
  add('sq','<rect x="55" y="61" width="34" height="34" fill="#FFCC80"/>');
  add('rect','<rect x="20" y="70" width="12" height="25" fill="#BCAAA4"/>');
  [[26,56,6],[36,40,8],[50,23,10]].slice(0,rnd(1,3)).forEach(([x,y,r])=>add('ci',`<circle cx="${x}" cy="${y}" r="${r}" fill="#E0E0E0"/>`));
  [30,70].forEach(x=>add('ci',`<circle cx="${x}" cy="140" r="10" fill="#90A4AE"/>`));
  for(let c=0;c<cars;c++){ const x=100+c*100;
    add('rect',`<rect x="${x}" y="100" width="90" height="31" fill="#A5D6A7"/>`);
    [x+20,x+70].forEach(cx=>add('ci',`<circle cx="${cx}" cy="140" r="10" fill="#90A4AE"/>`));
    ({ tri:[['tri',x+30]], tri2:[['tri',x+8],['tri',x+50]], sq:[['sq',x+32]], sq2:[['sq',x+10],['sq',x+52]], tsq:[['tri',x+8],['sq',x+52]] })[pick(['tri','tri2','sq','sq2','tsq'])]
      .forEach(([k,ix])=>k==='tri'?add('tri',`<path d="M${ix} 100 L${ix+30} 100 L${ix+15} 73Z" fill="#FFF59D"/>`):add('sq',`<rect x="${ix}" y="74" width="26" height="26" fill="#90CAF9"/>`));
  }
  return els;
}
const trainSvg=els=>`<svg viewBox="0 0 300 160" width="300" height="160"><g stroke="#4A3728" stroke-width="2.5">${els.map(e=>e.svg.replace('/>',` data-k="${e.k}"/>`)).join('')}</g></svg>`;
function genShapes(k){
  let els; const cnt=k2=>els.filter(e=>e.k===k2).length;
  do{ els=genTrain(); }while(cnt(k)<1);
  const n=cnt(k);
  return { prompt:`火車上有幾個<b style="color:#E8590C">${SHN[k]}</b>？`, speech:`火車上有幾個${SHN[k]}？仔細鼠喔`,
    visual:trainSvg(els), options:NUMS(1,10), cols:5, answer:n, t:{type:'shapes',els,k,n},
    detail:v=>`${SHN[k]}有${n}個 答${v}${k==='sq'&&v===n+cnt('rect')?'（長方形也算進去）':k==='rect'&&v===n+cnt('sq')?'（正方形也算進去）':(Math.abs(v-n)===1?'（漏數或多數一個）':'')}` };
}

/* ========== 遊戲流程 ========== */
let allMode=false, li=0, qs=[], qi=0, tries=0, rec=null, busy=false;

function startLevel(i){
  li=i; const L=LEVELS[i]; qs=L.make(); qi=0;
  rec = cur.levels[L.id] = { first:0, done:0, wrong:[], total:qs.length }; saveAll(sessions);
  $('lvName').textContent = `第${i+1}關 ${L.name}`;
  show('game'); showQ();
}
function drawDots(){ $('dots').innerHTML = qs.map((_,i)=>`<span class="${i<qi?'done':''}"></span>`).join(''); }

function showQ(){
  const q=qs[qi]; tries=0; busy=false;
  drawDots();
  $('promptTxt').innerHTML=q.prompt; $('fb').textContent=''; $('fb').className='feedback';
  const stage=$('stage'); stage.className = q.ord?'ord':(q.shapes?'shapes':(q.vert?'vert':'')); stage.innerHTML='';
  if(q.custom){ (q.build||buildTake)(q, stage, v=>answer(v,null)); say(q.speech); return; }
  const vis=document.createElement('div'); vis.className='visual'; vis.innerHTML=q.visual;
  if(q.visual) stage.appendChild(vis);
  const opts=document.createElement('div'); opts.className='opts';
  opts.style.gridTemplateColumns=`repeat(${q.cols},1fr)`;
  q.options.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'+(q.len?' lenopt':'')+(q.big?' bigopt':'');
    if(q.big) { b.style.fontSize='44px'; b.style.minHeight='90px'; }
    if(o.html){ b.innerHTML=o.label; if(!q.len) b.style.fontSize='18px'; } else b.textContent=o.label;
    b.dataset.v=o.value; b.onclick=()=>answer(o.value,b);
    opts.appendChild(b);
  });
  stage.appendChild(opts);
  if(q.after) stage.insertAdjacentHTML('beforeend', q.after);
  q.showAnswer=()=>{ [...opts.children].forEach(b=>{ if(String(b.dataset.v)===String(q.answer)) b.classList.add('right'); }); };
  if(q.bean){ stage.classList.add('lock'); buildBean(q, stage, ()=>stage.classList.remove('lock')); }
  say(q.speech);
}

function answer(v, btn){
  if(busy) return;
  const q=qs[qi];
  if(String(v)===String(q.answer)){
    busy=true; if(tries===0) rec.first++;
    rec.done++; saveAll(sessions);
    if(btn) btn.classList.add('right');
    chime(); $('fb').className='feedback good'; $('fb').textContent=pick(['答對了！🎉','好棒！✨','你好厲害！👍']);
    say('答對了'); setTimeout(nextQ, 1100);
    return;
  }
  tries++;
  if(tries===1){ rec.wrong.push(q.detail(v)); saveAll(sessions); }
  const left = q.options ? q.options.length - tries : 99;   // 還沒點過的選項
  if(tries===1 && left>1){
    if(btn) btn.classList.add('tried');
    $('fb').className='feedback soft'; $('fb').textContent='再想想看～慢慢來 💪'; say('再想想看，慢慢來');
    return;
  }
  // 第二次還沒對：一起看教學，懂了再下一題
  busy=true; rec.done++; saveAll(sessions);
  if(btn) btn.classList.add('tried');
  $('fb').className='feedback show'; $('fb').textContent='沒關係，我們一起來看 👀';
  say('沒關係，我們一起來看'); setTimeout(()=>teach(q), 1200);
}

function nextQ(){
  qi++;
  if(qi<qs.length){ showQ(); return; }
  drawDots();
  const last = li===LEVELS.length-1;
  $('endTitle').textContent = `第${li+1}關 ${LEVELS[li].name} 完成！`;
  $('endMsg').textContent = last ? `${LEVELS.length} 關全部闖完了，你超棒！🏆` : pick(['你很認真喔！','越玩越厲害！','繼續加油！']);
  $('btnNext').style.display = last ? 'none' : '';
  $('btnNext').textContent = allMode ? '下一關 ➜' : `第${li+2}關 ${last?'':LEVELS[li+1].name} ➜`;
  const allRight = rec.done===qs.length && rec.first===qs.length;
  $('cert').style.display = allRight ? '' : 'none';
  if(allRight){
    rec.cert = true; saveAll(sessions);
    if(!badges[LEVELS[li].id]){ badges[LEVELS[li].id]=Date.now(); saveBadges(); }
    $('certN').textContent = qs.length;
    $('certLv').textContent = `第${li+1}關「${LEVELS[li].name}」`;
    $('certDate').textContent = fmtTime(Date.now()).split(' ')[0];
    $('endMsg').textContent = '全部答對！你拿到一張獎狀 🏅';
    say('哇！全部答對！你拿到一張獎狀，拿給阿嬤看，可以領獎喔！');
  } else say(`第${li+1}關完成，你很棒！`);
  const got=LEVELS.filter(L=>badges[L.id]).length;
  const justGrand = !badges._grand && got===LEVELS.length;
  if(justGrand){ badges._grand=Date.now(); saveBadges(); }
  $('collectEnd').textContent = got===LEVELS.length ? `🏆 ${LEVELS.length} 關全部全對！` : `🏅 全對收集 ${got} / ${LEVELS.length}，再加油！`;
  $('btnGetGrand').style.display = justGrand ? '' : 'none';
  if(justGrand){ $('btnNext').style.display='none'; setTimeout(()=>say(`哇！${LEVELS.length}關全部全對！按紅色按鈕，領你的通關證書！`), 3800); }
  show('end');
}
function showGrand(){
  $('gN').textContent = LEVELS.length;
  $('gDate').textContent = fmtTime(badges._grand||Date.now()).split(' ')[0];
  show('grand');
  say(`恭喜你！${LEVELS.length}關全部全對，通關成功！拿給阿嬤看，可以領大獎喔！`);
}

/* ========== 教學（第二次答錯時） ========== */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function sayWait(t){
  return new Promise(res=>{
    let done=false; const fin=()=>{ if(!done){ done=true; setTimeout(res,700); } };
    setTimeout(fin, 1200+t.length*560);              // 語音沒回應也會往下走
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang='zh-TW'; if(zhVoice) u.voice=zhVoice; u.rate=0.6;
    u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
  });
}
const badge=(el,n)=>el.insertAdjacentHTML('beforeend',`<i class="badge">${n}</i>`);
let teachId=0;
async function teach(q){
  const my=++teachId;
  const alive=()=>my===teachId && $('game').classList.contains('active');
  const stage=$('stage'); stage.className='';
  stage.innerHTML=`<div class="teach"><div class="t-title">🧑‍🏫 我們一起來看</div><div class="t-vis" id="tVis"></div><div class="t-say" id="tSay"></div></div>
    <div class="t-btns" id="tBtns" style="visibility:hidden"><button id="tAgain">🔁 再看一次</button><button id="tNext">👍 我懂了，下一題</button></div>`;
  $('fb').textContent='';
  // S(畫面文字, 唸的文字)：唸的文字裡動詞「數」要寫成「鼠」才會唸ㄕㄨˇ
  const S=async(txt,speak)=>{ if(!alive()) throw 'stop'; $('tSay').innerHTML=txt; await sayWait(speak||txt.replace(/<[^>]+>/g,'')); if(!alive()) throw 'stop'; };
  const P=async ms=>{ await wait(ms); if(!alive()) throw 'stop'; };
  try{ await TEACH[q.t.type](q.t, $('tVis'), S, P); }
  catch(e){ if(e!=='stop') console.error(e); return; }
  $('tBtns').style.visibility='visible';
  $('tAgain').onclick=()=>teach(q);
  $('tNext').onclick=()=>{ teachId++; if('speechSynthesis' in window) speechSynthesis.cancel(); nextQ(); };
}
const SHAPE_INFO={
  box:['方盒','只有平平的面','可以疊高，不會滾'],
  can:['圓罐','有平平的面，也有彎彎的面','站著可以疊，躺下來會滾'],
  ball:['球','只有彎彎的面','最會滾，不能疊'] };
const TEACH={
  async count({em,pos,n},vis,S){
    vis.innerHTML=`<div class="countbox">${pos.map(([x,y])=>`<span style="left:${x}px;top:${y}px">${em}</span>`).join('')}</div>`;
    const it=vis.querySelectorAll('span');
    await S('手指一個一個點，嘴巴一個一個念 👆');
    for(let i=0;i<n;i++){ it[i].classList.add('lit'); badge(it[i],i+1); await S(`${i+1}`); }
    await S(`最後念到 <b>${n}</b>，所以有 <b>${n}</b> 個！`);
  },
  async take({em,n},vis,S){
    vis.innerHTML=`<div class="bignum">${n}</div><div class="plate"></div>`;
    const plate=vis.querySelector('.plate');
    await S(`看清楚，數字是 <b>${n}</b>。放一個、念一個，念到 ${n} 就停！`);
    for(let i=1;i<=n;i++){ plate.insertAdjacentHTML('beforeend',`<span class="rel">${em}</span>`); badge(plate.lastElementChild,i); await S(`${i}`); }
    await S(`念到 <b>${n}</b>，停！盤子裡剛好 <b>${n}</b> 個 ✋`);
  },
  async seq({seq,hole,down},vis,S){
    vis.innerHTML=`<div class="numrow">${seq.map((x,i)=>`<div class="${i===hole?'q':''}">${i===hole?'?':x}</div>`).join('')}</div>`;
    const bx=vis.querySelectorAll('.numrow div');
    await S(down?'數字倒著排隊，一個比一個<b>少 1</b>':'數字排隊，一個比一個<b>多 1</b>', down?'數字倒著排隊，一個比一個少一':'數字排隊，一個比一個多一');
    for(let i=0;i<5;i++){ bx[i].classList.add('lit'); if(i===hole){ bx[i].textContent=seq[i]; bx[i].classList.add('ans'); } await S(`${seq[i]}`); }
    await S(`問號就是 <b>${seq[hole]}</b>！`);
  },
  async cmp({a,b,big},vis,S){
    vis.innerHTML=`<div class="numrow small">${range(1,10).map(x=>`<div>${x}</div>`).join('')}</div>`;
    const bx=vis.querySelectorAll('.numrow div');
    await S('數字排隊：越<b>後面</b>越大，越<b>前面</b>越小');
    bx[a-1].classList.add('mk1'); await S(`${a} 在這裡`);
    bx[b-1].classList.add('mk2'); await S(`${b} 在這裡`);
    const ans=big?Math.max(a,b):Math.min(a,b);
    bx[ans-1].classList.add('ans');
    await S(big?`<b>${ans}</b> 排在比較後面，所以 <b>${ans}</b> 比較大！`:`<b>${ans}</b> 排在比較前面，所以 <b>${ans}</b> 比較小！`);
  },
  async ord({row,fromLeft,k,idx},vis,S){
    vis.innerHTML=`<div class="sides"><span>⬅ 左邊</span><span>右邊 ➡</span></div><div class="ordrow">${row.map(a=>`<span class="rel">${a}</span>`).join('')}</div>`;
    const sd=vis.querySelectorAll('.sides span'), it=vis.querySelectorAll('.ordrow span');
    const side=fromLeft?'左':'右';
    sd[fromLeft?0:1].classList.add('sidelit');

    if(kind==='total'){ await S('一隻一隻數，不要漏掉', '一隻一隻鼠，不要漏掉');
      for(let i=0;i<n;i++){ sp[i].classList.add('lit'); badge(sp[i],i+1); await S(`${i+1}`); }
      await S(`全部有 <b>${n}</b> 隻！`); return; }
    await S('最靠近櫃台🏪的是<b>第 1 個</b>，從這邊開始數', '最靠近櫃台的是第一個，從這邊開始鼠');
    if(kind==='pos'){ for(let i=0;i<k;i++){ badge(sp[i],i+1); await S(`第${i+1}個`); }
      who.classList.add('ans'); await S(`${row[k-1]} 排在第 <b>${k}</b> 個！`, `${wn}排在第${k}個`); return; }
    who.classList.add('ans'); await S(`先找到 ${row[k-1]}`, `先找到${wn}`);
    if(kind==='front'){ for(let i=0;i<k-1;i++){ sp[i].classList.add('lit'); badge(sp[i],i+1); await S(`${i+1}`); }
      await S(`${row[k-1]} 前面有 <b>${k-1}</b> 隻（自己不算）`, `${wn}前面有${k-1}隻，自己不算`); }
    else { for(let i=k;i<n;i++){ sp[i].classList.add('lit'); badge(sp[i],i-k+1); await S(`${i-k+1}`); }
      await S(`${row[k-1]} 後面有 <b>${n-k}</b> 隻（自己不算）`, `${wn}後面有${n-k}隻，自己不算`); }
  },
  async race({kind,an,xs,ti,k},vis,S){
    vis.innerHTML=raceHTML(an,xs);
    const sp=vis.querySelectorAll('.rn'), order=range(0,4).sort((a,b)=>xs[b]-xs[a]), r=order.indexOf(ti)+1;
    await S('越靠近終點🏁，就跑得越<b>前面</b>', '越靠近終點，就跑得越前面');
    for(let j=0;j<5;j++){ const i=order[j]; badge(sp[i],j+1); await S(`第${j+1}名`);
      if(kind==='who'&&j+1===k){ sp[i].classList.add('ans'); break; }
      if(kind!=='who'&&i===ti){ sp[i].classList.add('ans'); break; } }
    if(kind==='rank') await S(`${an[ti]} 跑<b>第 ${r} 名</b>！`, `${ANAME[an[ti]]}跑第${r}名`);
    else if(kind==='who') await S(`第 ${k} 名是 ${an[order[k-1]]}！`, `第${k}名是${ANAME[an[order[k-1]]]}`);
    else await S(`${an[ti]} 是第 ${r} 名，前面有 <b>${r-1}</b> 隻（自己不算）`, `${ANAME[an[ti]]}是第${r}名，前面有${r-1}隻，自己不算`);
  },
  async seq2({seq,ask,other,down},vis,S){
    vis.innerHTML=`<div class="numrow">${seq.map((x,i)=>`<div class="${i===ask?'q':(i===other?'blank':'')}">${i===ask?'?':(i===other?'':x)}</div>`).join('')}</div>`;
    const bx=vis.querySelectorAll('.numrow div');
    await S(down?'看一看：數字越來越<b>小</b>，一個比一個<b>少 1</b>':'看一看：數字越來越<b>大</b>，一個比一個<b>多 1</b>', down?'看一看，數字越來越小，一個比一個少一':'看一看，數字越來越大，一個比一個多一');
    for(let i=0;i<5;i++){ bx[i].classList.add('lit'); if(i===ask||i===other) bx[i].textContent=seq[i]; if(i===ask) bx[i].classList.add('ans'); await S(`${seq[i]}`); }
    await S(`問號就是 <b>${seq[ask]}</b>！`);
  },
  async short({p,it,itn,iq,a,b},vis,S,P){
    await TEACH.enough({p,it,itn,a,b},vis,S,P);
    await S(`沒拿到的有 <b>${a-b}</b> 個，所以${itn}還差 <b>${a-b}</b> ${iq}！`, `沒拿到的有${a-b}個，所以還差${a-b}${iq}`);
  },
  async bond({total,p1,p2,unk},vis,S){
    vis.innerHTML=`<div class="dotrow" id="dr"></div><div class="bond" id="bd"></div>`;
    const dr=vis.querySelector('#dr'), bd=vis.querySelector('#bd');
    if(unk==='total'){
      dr.innerHTML=Array(p1).fill('<div class="dot o"></div>').join('')+'<div class="gap"></div>'+Array(p2).fill('<div class="dot b"></div>').join('');
      await S(`<span style="color:#FB8C00">${p1}</span> 個和 <span style="color:#1E88E5">${p2}</span> 個，合起來`, `${p1}個和${p2}個，合起來`);
      if(p1===0||p2===0) await S('<b>0</b> 就是一個都沒有喔', '零，就是一個都沒有喔');
      const ds=dr.querySelectorAll('.dot'); for(let i=0;i<ds.length;i++){ badge(ds[i],i+1); await S(`${i+1}`); }
      bd.innerHTML=`${p1} 和 ${p2} 合起來是 <b>${total}</b>`;
      await S(`合起來是 <b>${total}</b>！`); return;
    }
    const known=unk==='p1'?p2:p1, ans=unk==='p1'?p1:p2;
    dr.innerHTML=Array(total).fill('<div class="dot e"></div>').join('');
    const ds=[...dr.querySelectorAll('.dot')];
    await S(`總共 <b>${total}</b> 個`);
    for(let i=0;i<known;i++) ds[i].className='dot b';
    await S(known?`已經知道有 <b>${known}</b> 個（藍色）`:'已經知道的是 <b>0</b> 個，一個都沒有', known?`已經知道有${known}個`:'已經知道的是零個，一個都沒有');
    if(ans===0){ await S('全部都用完了，沒有剩下的，所以是 <b>0</b>！', '全部都用完了，沒有剩下的，所以是零'); }
    else { await S('剩下的數一數', '剩下的鼠一鼠'); for(let i=known;i<total;i++){ ds[i].className='dot o'; badge(ds[i],i-known+1); await S(`${i-known+1}`); } }
    bd.innerHTML=`${total} 可以分成 ${known} 和 <b>${ans}</b>`;
    await S(`${total} 可以分成 ${known} 和 <b>${ans}</b>！`);
  },
  async sand({i1,o1,i2,o2},vis,S){
    vis.innerHTML=sandHTML(i1,o1,i2,o2);
    vis.querySelectorAll('.outb span').forEach(s=>s.style.opacity='.25');
    await S('只算丟<b>進圈圈裡面</b>的，外面的不算');
    let c=0; for(const s of vis.querySelectorAll('.ring span')){ c++; s.classList.add('lit'); badge(s,c); await S(`${c}`); }
    await S(`第一次 ${i1} 個，第二次 ${i2} 個，合起來 <b>${i1+i2}</b> 個！`, `第一次${i1}個，第二次${i2}個，合起來${i1+i2}個`);
  },
  async ten({a,em},vis,S){
    vis.innerHTML=tenHTML(a,em);
    const cells=[...vis.querySelectorAll('.tenf div')];
    await S(`10 個格子裝滿就是 10。已經有 <b>${a}</b> 個`, `十個格子裝滿就是十。已經有${a}個`);
    await S('數一數<b>空的格子</b>，還要補幾個？', '鼠一鼠空的格子，還要補幾個？');
    for(let i=a;i<10;i++){ cells[i].textContent=em; cells[i].classList.add('lit'); badge(cells[i],i-a+1); await S(`${i-a+1}`); }
    await S(`${a} 和 <b>${10-a}</b> 合起來是 10！`, `${a}和${10-a}合起來是十`);
  },
  async solid({kind,s,ans,opts},vis,S){
    if(kind==='trace'){
      vis.innerHTML=`<div class="solid">${solidSvg(s,130)}</div><div class="shrow">${opts.map(k=>`<div class="shc" data-k="${k}">${sh2Svg(k)}<div>${SH2[k][0]}</div></div>`).join('')}</div>`;
      await S(`這是${SOLNM[s]}，看看它有哪些面`);
      await S(FACE_SAY[s]);
      vis.querySelectorAll('.shc').forEach(c=>{ if(c.dataset.k===ans) c.classList.add('ans'); else c.style.opacity='.3'; });
      await S(`所以可以描出 <b>${SH2[ans][0]}</b>！`); return;
    }
    vis.innerHTML=`<div class="shrow">${opts.map(k=>`<div class="shc" data-k="${k}" style="visibility:hidden">${solidSvg(k,80)}<div>${ROLL_SAY[k]}</div></div>`).join('')}</div>`;
    for(const c of vis.querySelectorAll('.shc')){ c.style.visibility='visible'; await S(`${SOLNM[c.dataset.k]}：${ROLL_SAY[c.dataset.k]}`); }
    vis.querySelector(`.shc[data-k="${ans}"]`).classList.add('ans');
    await S(kind==='roll'?`${SOLNM[ans]}有<b>彎彎的面</b>，最容易滾！`:'球全部都是彎彎的面，放不穩，<b>不能疊高</b>！');
  },
  async shapes({els,k,n},vis,S){
    vis.innerHTML=trainSvg(els);
    const svg=vis.querySelector('svg'), all=[...svg.querySelectorAll('[data-k]')];
    await S(SHAPE_HINT[k]);
    all.forEach(e=>{ if(e.dataset.k!==k) e.style.opacity='.18'; });
    const tg=all.filter(e=>e.dataset.k===k);
    for(let j=0;j<tg.length;j++){ const b=tg[j].getBBox(); tg[j].setAttribute('stroke','#E8590C'); tg[j].setAttribute('stroke-width','4');
      svg.insertAdjacentHTML('beforeend',`<g><circle cx="${b.x+b.width/2}" cy="${b.y+b.height/2}" r="9" fill="#E8590C"/><text x="${b.x+b.width/2}" y="${b.y+b.height/2+5}" font-size="13" font-weight="900" fill="#fff" text-anchor="middle">${j+1}</text></g>`);
      await S(`${j+1}`); }
    await S(`${SHN[k]}有 <b>${n}</b> 個！`);
  },
});

/* ========== 大人看結果 ========== */
function statusOf(r){
  if(!r || r.done===0) return ['s-none','—未玩','—'];
  const p=r.first/r.done;
  if(p>=0.8) return ['s-ok','✅會了','✅'];
  if(p>=0.4) return ['s-mid','⚠️不穩','⚠️'];
  return ['s-bad','❌要補','❌'];
}
const PRIORITY=['find','fix','bond2','ten','word','queue','seq2','race','buy','rope','step','lpart','solid','shapes'];
function fmtTime(t){ const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

function drawReport(s){
  const played = LEVELS.filter(L=>s.levels[L.id] && s.levels[L.id].done>0);
  const rows = LEVELS.map((L,i)=>{
    const r=s.levels[L.id]; const [cls,,icon]=statusOf(r);
    const sc = r && r.done ? `${r.first}/${r.done}` : '';
    const wr = r && r.wrong.length ? r.wrong.slice(0,2).join('<br>') : (r&&r.done?'—':'');
    return `<tr class="${cls}"><td class="st">${icon}</td><td><span class="u">${L.unit.split(" ")[0]}</span>${i+1}. ${L.name}：${L.concept}</td><td class="sc">${sc}</td><td class="wr">${wr}</td></tr>`;
  }).join('');
  let focus;
  const weak = played.map(L=>({L, p:s.levels[L.id].first/s.levels[L.id].done}))
    .filter(x=>x.p<0.8)
    .sort((a,b)=> a.p-b.p || PRIORITY.indexOf(a.L.id)-PRIORITY.indexOf(b.L.id));
  if(!played.length) focus='還沒有玩過任何一關。';
  else if(!weak.length) focus='<b>玩過的關卡都會了！</b> 把沒玩的關卡玩完，每關都全對就能拿通關大獎狀！';
  else focus=`<b>最該先補：${weak[0].L.name}（${weak[0].L.unit}）</b><br>在家這樣玩：${weak[0].L.tip}`;
  $('rpBody').innerHTML = `
    <div class="rp-head"><div class="sun"><img src="logo.png" alt=""></div><h2>期中進階挑戰 · 結果<small>${fmtTime(s.start)}　玩了 ${played.length}/${LEVELS.length} 關</small></h2></div>
    <div class="rp-legend">✅會了　⚠️不穩　❌要補　—未玩　（答對＝第一次就答對）</div>
    <table class="rp"><tr><th></th><th>單元／觀念</th><th>答對</th><th>錯在哪</th></tr>${rows}</table>
    <div class="rp-focus">${focus}</div>
    ${(()=>{ const c=LEVELS.map((L,i)=>s.levels[L.id]&&s.levels[L.id].cert?`第${i+1}關 ${L.name}`:null).filter(Boolean); return c.length?`<div class="rp-focus" style="border-color:var(--green)">🏅 <b>拿到獎狀：</b>${c.join('、')}</div>`:''; })()}
    ${(()=>{ const miss=LEVELS.map((L,i)=>badges[L.id]?null:`第${i+1}關 ${L.name}`).filter(Boolean);
      return badges._grand ? `<div class="rp-focus" style="border-color:#E53935">🏆 <b>${LEVELS.length} 關全對收集完成，已通關</b>（${fmtTime(badges._grand)}）</div>`
        : `<div class="rp-focus" style="border-color:var(--gold)">🏅 <b>全對收集 ${LEVELS.length-miss.length}/${LEVELS.length}</b>　還差：${miss.join('、')}</div>`; })()}
    <div class="rp-note">錯了沒關係，陪他再試一次就好 😊　—— SUNNY 魔法數學</div>`;
  $('hist').innerHTML = sessions.length>1 ? '<b>以前的紀錄（點一下看）</b>' + sessions.slice().reverse().map((x,k)=>{
    const idx=sessions.length-1-k;
    const icons=LEVELS.map(L=>statusOf(x.levels[L.id])[2]).join('');
    return `<div class="${x===s?'cur':''}" data-k="${idx}">${fmtTime(x.start)}　${icons}</div>`; }).join('') : '';
  document.querySelectorAll('#hist div[data-k]').forEach(d=>d.onclick=()=>drawReport(sessions[+d.dataset.k]));
}

/* ========== 按鈕 ========== */
$('btnAll').onclick=()=>{ allMode=true; const next=LEVELS.findIndex(L=>!(cur.levels[L.id] && cur.levels[L.id].done>=(cur.levels[L.id].total||5))); startLevel(next<0?0:next); };
$('btnSpk').onclick=()=>say(qs[qi].speech);
$('btnQuit').onclick=()=>{ teachId++; speechSynthesis && speechSynthesis.cancel(); drawHome(); show('home'); };
$('btnNext').onclick=()=>startLevel(li+1);
$('btnGetGrand').onclick=showGrand;
$('btnGrand').onclick=showGrand;
$('btnGrandHome').onclick=()=>{ drawHome(); show('home'); };
$('btnEndHome').onclick=()=>{ drawHome(); show('home'); };
$('btnAdult').onclick=()=>{ drawReport(cur); show('report'); };
$('btnRpHome').onclick=()=>{ drawHome(); show('home'); };
$('btnNewSess').onclick=()=>{ if(confirm('要開始新的一次測驗嗎？（舊的紀錄會保留在下面）')){ newSession(); drawHome(); show('home'); } };
drawHome();
(()=>{ const im=new Image(); im.onload=()=>document.querySelectorAll('.cert').forEach(c=>c.classList.add('hasimg')); im.src='cert.jpg'; })();
</script>
