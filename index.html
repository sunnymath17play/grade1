<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SUNNY 魔法數學 · 一年級數感闖關</title>
<link rel="icon" href="logo.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --orange:#F5820A; --gold:#F9A81B; --yellow:#FBC02D;
    --deep:#E8590C; --brown:#4A3728; --cream:#FFF8ED;
    --green:#43A047; --red:#E53935; --blue:#1E88E5;
  }
  html,body{height:100%;}
  body{
    font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(160deg,#FFF3D9 0%,#FFE4B8 100%);
    color:var(--brown); user-select:none; touch-action:manipulation;
  }
  #app{ max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
  .screen{ flex:1; display:none; flex-direction:column; padding:16px; }
  .screen.active{ display:flex; }
  button{ font-family:inherit; color:inherit; border:none; cursor:pointer; }

  .brand{ display:flex; align-items:center; justify-content:center; gap:10px; padding:4px 0; }
  .sun{ width:44px; height:44px; overflow:hidden; flex:none; }
  .sun img{ width:111px; margin:-28px 0 0 0; display:block; }
  .brand .txt{ font-weight:800; font-size:20px; color:var(--deep); letter-spacing:1px; }
  .brand .txt small{ display:block; font-size:12px; color:var(--gold); font-weight:700; letter-spacing:3px; }

  /* ---- Home ---- */
  .home-title{ text-align:center; margin:10px 0 4px; font-size:34px; font-weight:900; color:var(--deep);
    text-shadow:2px 2px 0 #fff, 3px 3px 0 rgba(245,130,10,.25); }
  .home-sub{ text-align:center; font-size:15px; color:#B0742A; margin-bottom:14px; font-weight:600; }
  .all-card{ background:linear-gradient(135deg,#F9A81B,#F5820A); color:#fff; border-radius:22px; padding:18px;
    font-size:24px; font-weight:900; text-align:center; box-shadow:0 6px 0 #C9620A; margin:0 4px 14px; }
  .all-card:active{ transform:translateY(3px); box-shadow:0 3px 0 #C9620A; }
  .lv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 4px; }
  .lv-card{ background:#fff; border-radius:18px; padding:12px 10px; text-align:center; position:relative;
    box-shadow:0 5px 0 rgba(245,130,10,.18), 0 6px 14px rgba(0,0,0,.05); border:3px solid var(--gold); }
  .lv-card:active{ transform:scale(.97); }
  .lv-card .em{ font-size:34px; }
  .lv-card .nm{ font-size:18px; font-weight:800; margin-top:2px; }
  .lv-card .no{ position:absolute; top:6px; left:10px; font-size:12px; color:#B0742A; font-weight:700; }
  .lv-card .ok{ position:absolute; top:4px; right:8px; font-size:16px; }
  .adult-btn{ margin:18px 4px 8px; text-align:center; padding:13px; background:rgba(255,255,255,.75);
    border-radius:16px; font-weight:700; color:var(--deep); font-size:15px; }

  /* ---- Game ---- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .topbar .home{ background:#fff; border-radius:12px; padding:8px 12px; font-size:15px; font-weight:700; }
  .topbar .lvname{ font-weight:900; font-size:18px; color:var(--deep); }
  .dots{ display:flex; gap:6px; }
  .dots span{ width:12px; height:12px; border-radius:50%; background:#fff; border:2px solid var(--gold); }
  .dots span.done{ background:var(--gold); }
  .prompt{ display:flex; align-items:flex-start; gap:10px; background:#fff; border-radius:18px; padding:14px;
    margin:12px 0 10px; font-size:22px; font-weight:800; line-height:1.45; box-shadow:0 4px 0 rgba(245,130,10,.15); }
  .prompt .spk{ flex:none; font-size:24px; background:var(--cream); border-radius:12px; width:44px; height:44px; }
  .visual{ display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom:10px; }
  .opts{ display:grid; gap:10px; }
  .opt{ background:#fff; border-radius:16px; min-height:60px; font-size:30px; font-weight:900; color:var(--brown);
    box-shadow:0 5px 0 rgba(30,136,229,.35); border:3px solid #BBDEFB; transition:opacity .2s; }
  .opt:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(30,136,229,.35); }
  .opt.tried{ opacity:.35; pointer-events:none; }
  .opt.right{ border-color:var(--green); background:#E8F5E9; animation:pop .5s; }
  @keyframes pop{ 50%{ transform:scale(1.12);} }
  .feedback{ text-align:center; font-size:22px; font-weight:900; min-height:36px; margin-top:12px; }
  .feedback.good{ color:var(--green); } .feedback.soft{ color:var(--orange); } .feedback.show{ color:var(--blue); }
  .lock .opts, .lock .take-btns{ pointer-events:none; }

  /* count box */
  .countbox{ position:relative; width:300px; height:200px; background:#fff; border-radius:18px; border:3px dashed var(--gold); }
  .countbox span{ position:absolute; font-size:34px; line-height:1; }
  /* number row */
  .numrow{ display:flex; gap:8px; }
  .numrow div{ width:52px; height:58px; border-radius:12px; background:#fff; border:3px solid var(--gold);
    font-size:30px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .numrow div.q{ border-color:var(--blue); color:var(--blue); background:#E3F2FD; }
  .bignum{ font-size:64px; font-weight:900; color:var(--deep); line-height:1; }
  /* take */
  .take{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  .plate{ width:300px; min-height:130px; border-radius:50%/40%; background:#fff; border:5px solid #FFE0B2;
    display:flex; flex-wrap:wrap; align-content:center; justify-content:center; gap:2px; padding:16px 30px; font-size:32px; }
  .take-btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
  .take-btns .jar{ grid-column:1/3; font-size:24px; }
  .take-btns button{ min-height:58px; border-radius:16px; font-size:20px; font-weight:800; background:#fff;
    border:3px solid #BBDEFB; box-shadow:0 5px 0 rgba(30,136,229,.35); }
  .take-btns .okb{ background:var(--green); color:#fff; border-color:var(--green); box-shadow:0 5px 0 #2E7D32; }
  /* ordinal */
  .sides{ display:flex; justify-content:space-between; width:100%; font-size:16px; font-weight:800; color:#B0742A; margin-bottom:6px; }
  .ord .opts{ grid-template-columns:repeat(7,1fr) !important; gap:4px; }
  .ord .opt{ font-size:30px; min-height:58px; padding:0; }
  /* compare rows */
  .rows{ background:#fff; border-radius:16px; padding:10px; }
  .rows .r{ display:grid; grid-template-columns:repeat(10,28px); gap:2px; font-size:24px; text-align:center; min-height:34px; }
  /* beans */
  .beanstage{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px; background:#fff;
    border-radius:18px; padding:14px; width:300px; min-height:110px; }
  .bean{ width:26px; height:20px; border-radius:50%; background:#8D5524; box-shadow:inset -3px -3px 0 rgba(0,0,0,.2); }
  .cup{ width:86px; height:76px; background:linear-gradient(#EF6C00,#F9A81B); clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);
    color:#fff; font-size:38px; font-weight:900; display:flex; align-items:center; justify-content:center; animation:drop .5s; }
  @keyframes drop{ from{ transform:translateY(-60px); opacity:0;} }
  .bond{ margin-top:10px; font-size:22px; font-weight:800; }
  .bond b{ color:var(--deep); font-size:28px; }
  .bond .box{ display:inline-block; width:38px; height:38px; border:3px solid var(--blue); border-radius:8px; vertical-align:middle; }
  /* length */
  .bar{ height:26px; border-radius:6px 14px 14px 6px; }
  .lenopt{ display:flex; align-items:center; gap:10px; padding:10px 12px; min-height:56px; font-size:18px; }
  .lenopt .lbl{ width:30px; flex:none; }
  .fair{ display:flex; flex-direction:column; gap:8px; padding:14px; font-size:20px; }
  .fair .bar{ height:20px; }
  /* shapes */
  .shapes .opt{ font-size:48px; min-height:90px; }

  /* ---- Level end ---- */
  .end-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; }
  .end-wrap .stars{ font-size:56px; animation:pop .8s; }
  .end-wrap h2{ font-size:30px; color:var(--deep); }
  .end-wrap p{ font-size:18px; color:#9A6B3A; font-weight:700; }
  .big-btn{ width:100%; max-width:340px; padding:16px; border-radius:18px; font-size:22px; font-weight:900;
    background:linear-gradient(135deg,#F9A81B,#F5820A); color:#fff; box-shadow:0 5px 0 #C9620A; }
  .big-btn.ghost{ background:#fff; color:var(--deep); box-shadow:0 5px 0 rgba(245,130,10,.25); }

  /* ---- Report (給大人) ---- */
  #report{ background:#fff; padding:12px; }
  .rp-head{ display:flex; align-items:center; gap:8px; border-bottom:3px solid var(--gold); padding-bottom:6px; }
  .rp-head .sun{ width:36px; height:36px; } .rp-head .sun img{ width:91px; margin:-23px 0 0 0; }
  .rp-head h2{ font-size:17px; color:var(--deep); line-height:1.25; }
  .rp-head h2 small{ display:block; font-size:12px; color:#9A8570; font-weight:600; }
  table.rp{ width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; }
  table.rp th{ white-space:nowrap; background:#FFF3D9; font-size:12px; padding:4px 3px; text-align:left; }
  table.rp td{ border-bottom:1px solid #F3E2C7; padding:5px 3px; vertical-align:top; line-height:1.35; }
  table.rp td.st{ font-size:12px; white-space:nowrap; font-weight:800; }
  table.rp td.sc{ white-space:nowrap; font-weight:800; text-align:center; }
  table.rp td .u{ color:#9A8570; font-size:11px; display:block; }
  table.rp td.wr{ font-size:12px; color:#6D4C41; }
  tr.s-ok td.st{ color:var(--green); } tr.s-mid td.st{ color:#EF6C00; } tr.s-bad td.st{ color:var(--red); }
  tr.s-none td{ color:#BDBDBD; }
  .rp-focus{ margin-top:10px; background:#FFF8E1; border-left:5px solid var(--orange); border-radius:8px; padding:8px 10px; font-size:14px; line-height:1.5; }
  .rp-focus b{ color:var(--deep); }
  .rp-note{ margin-top:6px; font-size:12px; color:#9A8570; text-align:center; }
  .rp-actions{ display:flex; gap:8px; margin-top:14px; }
  .rp-actions button{ flex:1; padding:12px; border-radius:12px; font-weight:800; font-size:15px; background:#FFF3D9; color:var(--deep); }
  .hist{ margin-top:12px; font-size:13px; }
  .hist div{ padding:7px 8px; border-radius:8px; background:#FAFAFA; margin-top:4px; }
  .hist div.cur{ background:#FFF3D9; font-weight:800; }
</style>
</head>
<body>
<div id="app">

  <!-- 首頁 -->
  <section class="screen active" id="home">
    <div class="brand"><div class="sun"><img src="logo.png" alt=""></div><div class="txt">SUNNY<small>魔法數學</small></div></div>
    <div class="home-title">數感闖關</div>
    <div class="home-sub">✦ 一年級 · 8 個小關卡 ✦</div>
    <button class="all-card" id="btnAll">🚀 全部闖關</button>
    <div class="lv-grid" id="lvGrid"></div>
    <button class="adult-btn" id="btnAdult">📋 大人看結果</button>
  </section>

  <!-- 遊戲 -->
  <section class="screen" id="game">
    <div class="topbar">
      <button class="home" id="btnQuit">🏠</button>
      <div class="lvname" id="lvName"></div>
      <div class="dots" id="dots"></div>
    </div>
    <div class="prompt"><button class="spk" id="btnSpk">🔊</button><div id="promptTxt"></div></div>
    <div id="stage"></div>
    <div class="feedback" id="fb"></div>
  </section>

  <!-- 關卡結束 -->
  <section class="screen" id="end">
    <div class="end-wrap">
      <div class="stars">⭐⭐⭐</div>
      <h2 id="endTitle"></h2>
      <p id="endMsg"></p>
      <button class="big-btn" id="btnNext">下一關 ➜</button>
      <button class="big-btn ghost" id="btnEndHome">回首頁</button>
    </div>
  </section>

  <!-- 大人看結果 -->
  <section class="screen" id="report">
    <div id="rpBody"></div>
    <div class="rp-actions">
      <button id="btnRpHome">🏠 回首頁</button>
      <button id="btnNewSess">🆕 換下一次測</button>
    </div>
    <div class="hist" id="hist"></div>
  </section>
</div>

<script>
/* ========== 小工具 ========== */
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const sample = (arr,n) => shuffle(arr).slice(0,n);
const range = (a,b) => Array.from({length:b-a+1},(_,i)=>a+i);

/* 語音唸題 */
let zhVoice = null;
function loadVoice(){
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh[-_]HK/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(t){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'zh-TW'; if(zhVoice) u.voice = zhVoice; u.rate = 0.85;
  speechSynthesis.speak(u);
}
/* 答對小鈴聲（答錯不出聲） */
let actx=null;
function chime(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [880,1320].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=f; o.type='sine'; o.connect(g); g.connect(actx.destination);
      const t=actx.currentTime+i*0.12; g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.35);
      o.start(t); o.stop(t+.4);
    });
  }catch(e){}
}

/* ========== 紀錄（只存在這台裝置） ========== */
const KEY='g1sense_sessions';
function loadAll(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function saveAll(a){ try{ localStorage.setItem(KEY, JSON.stringify(a.slice(-20))); }catch(e){} }
let sessions = loadAll();
let cur = null;               // 目前這一次測驗
function newSession(){ cur = { start: Date.now(), levels:{} }; sessions.push(cur); saveAll(sessions); }
function ensureSession(){
  // 3 小時內接著玩算同一次
  const last = sessions[sessions.length-1];
  if(last && Date.now()-last.start < 3*3600*1000){ cur = last; } else newSession();
}
ensureSession();

/* ========== 題目產生 ========== */
const FRUITS=['🍎','🍓','🍊','🍌','🍇','🍒','🍐','🍋'];
const ANIMALS=['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧'];
const NUMS = (a,b)=>range(a,b).map(n=>({label:n,value:n}));

function genCount(){
  const n=rnd(1,10), em=pick(FRUITS);
  const cells=sample(range(0,19),n);
  const items=cells.map(c=>{ const col=c%5,row=Math.floor(c/5);
    return `<span style="left:${12+col*56+rnd(-6,6)}px;top:${8+row*47+rnd(-4,4)}px">${em}</span>`; }).join('');
  return { prompt:`數一數，有幾個 ${em}？`, speech:'數一數，有幾個？',
    visual:`<div class="countbox">${items}</div>`,
    options:NUMS(1,10), cols:5, answer:n,
    detail:v=>`${n}個 答${v}${Math.abs(v-n)===1?'（差1，可能漏數或重複數）':''}` };
}

function genTake(){
  const n=rnd(3,10), em=pick(['🍪','🍬','🍩','🧁']);
  return { prompt:`請放 <b style="color:#E8590C;font-size:30px">${n}</b> 個 ${em} 到盤子裡`, speech:`請放${n}個到盤子裡，放好了按好了`,
    custom:true, answer:n, em,
    detail:v=>`要${n}個 拿了${v}個` };
}
function buildTake(q, area, submit){
  let cnt=0;
  area.innerHTML=`<div class="take"><div class="plate" id="plate"></div>
    <div class="take-btns"><button class="jar" id="tkAdd">${q.em} 點我放一個</button>
    <button id="tkUndo">↩ 拿回一個</button><button class="okb" id="tkOk">✅ 好了</button></div></div>`;
  const plate=$('plate');
  const draw=()=>{ plate.innerHTML = Array(cnt).fill(`<span>${q.em}</span>`).join(''); };
  $('tkAdd').onclick=()=>{ if(cnt<15){ cnt++; draw(); } };
  $('tkUndo').onclick=()=>{ if(cnt>0){ cnt--; draw(); } };
  $('tkOk').onclick=()=>submit(cnt);
  q.showAnswer=()=>{ cnt=q.answer; draw(); };
}

function genSeq(kind){
  if(kind==='cmp'){
    let a=rnd(1,10), b; do{ b=rnd(1,10); }while(b===a);
    const big = Math.random()<.6;
    const ans = big ? Math.max(a,b) : Math.min(a,b);
    return { prompt:`哪一個比較<b style="color:#E8590C">${big?'大':'小'}</b>？`, speech:`哪一個數字比較${big?'大':'小'}？`,
      visual:'', options:[{label:a,value:a},{label:b,value:b}], cols:2, big:true, answer:ans,
      detail:v=>`${a}和${b}比較${big?'大':'小'} 答${v}` };
  }
  const down = Math.random()<.3;
  const s = rnd(1,6); let seq = range(s,s+4); if(down) seq.reverse();
  const hole = rnd(0,4), ans = seq[hole];
  const show = seq.map((x,i)=>i===hole?'?':x);
  return { prompt:`數字排隊，<b style="color:#1E88E5">?</b> 是多少？`, speech:'數字排隊，問號是多少？',
    visual:`<div class="numrow">${show.map(x=>`<div class="${x==='?'?'q':''}">${x}</div>`).join('')}</div>`,
    options:NUMS(1,10), cols:5, answer:ans,
    detail:v=>`${show.join(' ')} 答${v}${down?'（倒著數）':''}` };
}

function genOrd(){
  const row=sample(ANIMALS,7), fromLeft=Math.random()<.5, k=rnd(2,6);
  const idx = fromLeft ? k-1 : 7-k;                 // 從左邊數的位置（0 起算）
  const side = fromLeft?'左':'右';
  return { prompt:`從<b style="color:#E8590C">${side}邊</b>數起，第 <b style="color:#E8590C">${k}</b> 個是誰？`,
    speech:`從${side}邊數起，第${k}個是誰？`, ord:true,
    visual:`<div class="sides"><span>⬅ 左邊</span><span>右邊 ➡</span></div>`,
    options:row.map((a,i)=>({label:a,value:i})), cols:7, answer:idx,
    detail:v=>{ const mirror = 6-idx; let tag='';
      if(v===mirror) tag='（左右搞反）'; else if(Math.abs(v-idx)===1) tag='（差一個）';
      return `從${side}數第${k}個 點到${row[v]}${tag}`; } };
}

const PAIRS=[['🐰','🥕','兔子','紅蘿蔔'],['🐶','🦴','小狗','骨頭'],['🐵','🍌','猴子','香蕉'],['🐱','🐟','小貓','魚'],['🐔','🥚','雞','蛋']];
function genMore(kind){
  const [e1,e2,n1,n2]=pick(PAIRS);
  let a=rnd(3,10), b; do{ b=rnd(2,10); }while(b===a || Math.abs(a-b)>4);
  const rowsHtml=`<div class="rows"><div class="r">${Array(a).fill(`<span>${e1}</span>`).join('')}</div><div class="r">${Array(b).fill(`<span>${e2}</span>`).join('')}</div></div>`;
  if(kind==='which'){
    const ans = a>b?e1:e2;
    return { prompt:`${e1} 和 ${e2}，哪一種比較多？`, speech:`${n1}和${n2}，哪一種比較多？`,
      visual:rowsHtml, options:[{label:e1,value:e1},{label:e2,value:e2}], cols:2, big:true, answer:ans,
      detail:v=>`${e1}${a}個 ${e2}${b}個 選${v}比較多` };
  }
  const [bigE,smE,bigN,smN,bigC,smC] = a>b?[e1,e2,n1,n2,a,b]:[e2,e1,n2,n1,b,a];
  const ans=bigC-smC;
  return { prompt:`${bigE} 比 ${smE} 多幾個？`, speech:`${bigN}比${smN}多幾個？`,
    visual:rowsHtml, options:NUMS(1,10), cols:5, answer:ans,
    detail:v=>`${bigE}${bigC} ${smE}${smC} 多幾個 答${v}${v===bigC?'（答成總數）':''}` };
}

function genBean(){
  const n=rnd(5,10), hid=rnd(1,n-1), out=n-hid;
  return { prompt:`總共 <b style="color:#E8590C">${n}</b> 顆豆子，杯子裡藏了幾顆？`,
    speech:`這裡有${n}顆豆子。我用杯子蓋住一些。杯子外面還有${out}顆，杯子裡面藏了幾顆？`,
    bean:{n,out}, options:NUMS(1,9), cols:5, answer:hid,
    detail:v=>`${n}＝${out}＋□ 答${v}${v===out?'（答成外面的）':v===n?'（答成總數）':''}` };
}
function buildBean(q, area, ready){
  const {n,out}=q.bean;
  const stage=document.createElement('div'); stage.className='beanstage';
  stage.innerHTML = Array(n).fill('<div class="bean"></div>').join('');
  const bond=document.createElement('div'); bond.className='bond';
  bond.innerHTML=`<b>${n}</b> 可以分成 <b>${out}</b> 和 <span class="box"></span>`; bond.style.visibility='hidden';
  area.prepend(bond); area.prepend(stage);
  setTimeout(()=>{
    stage.innerHTML = `<div class="cup">?</div>` + Array(out).fill('<div class="bean"></div>').join('');
    bond.style.visibility='visible'; ready();
  }, 2600);
}

const COLORS=[['#E53935','紅'],['#1E88E5','藍'],['#43A047','綠']];
function genLen(kind){
  if(kind==='fair'){
    const fairFirst=Math.random()<.5;
    const card=(aligned,lab)=>{ const off = aligned?0:rnd(25,35);
      return `<div class="fair"><b>${lab}</b><div class="bar" style="width:80%;background:#E53935"></div>
        <div class="bar" style="width:62%;margin-left:${off}%;background:#1E88E5"></div></div>`; };
    const A=card(fairFirst,'Ａ'), B=card(!fairFirst,'Ｂ');
    return { prompt:'比長短，哪一種比法才<b style="color:#E8590C">公平</b>？', speech:'比長短，哪一種比法才公平？',
      visual:'', options:[{label:A,value:'A',html:true},{label:B,value:'B',html:true}], cols:1, answer:fairFirst?'A':'B',
      detail:v=>`公平比法（一端對齊）選了沒對齊的那個` };
  }
  const lens=sample(range(3,10),3), long=Math.random()<.6;
  const target = long ? lens.indexOf(Math.max(...lens)) : lens.indexOf(Math.min(...lens));
  return { prompt:`哪一條最<b style="color:#E8590C">${long?'長':'短'}</b>？`, speech:`哪一條最${long?'長':'短'}？`,
    visual:'', len:true,
    options:lens.map((L,i)=>({label:`<span class="lbl">${COLORS[i][1]}</span><div class="bar" style="width:${L*24}px;background:${COLORS[i][0]}"></div>`,value:i,html:true})),
    cols:1, answer:target,
    detail:v=>`最${long?'長':'短'} 選了${COLORS[v][1]}色` };
}

const SH={ box:['📦','🎁','🧊'], can:['🥫','🧻','🥁'], ball:['⚽','🏀','🎾','🏐'] };
const SHQ=[
  ['哪一個最容易滾動？','ball'], ['哪一個可以疊高，也可以滾動？','can'],
  ['哪一個只有平平的面？','box'], ['哪一個只有彎彎的面？','ball'],
  ['哪一個容易疊高，但不容易滾動？','box'], ['哪一個有平平的面，也有彎彎的面？','can'] ];
function genShape(i){
  const [txt,kind]=SHQ[i];
  const objs=shuffle(['box','can','ball']).map(k=>({label:pick(SH[k]),value:k}));
  const nm={box:'方盒',can:'圓罐',ball:'球'};
  return { prompt:txt, speech:txt, visual:'', shapes:true, options:objs, cols:3, answer:kind,
    detail:v=>`「${txt.replace('？','')}」選了${nm[v]}` };
}

/* ========== 關卡設定 ========== */
const LEVELS=[
  { id:'count', em:'🍎', name:'數一數', unit:'單元1 10以內的數', concept:'點數 1～10（一個一個數）',
    make:()=>range(1,5).map(genCount),
    tip:'吃點心前一起數：手指一個一個點、嘴巴一個一個念，點一個念一個。' },
  { id:'take', em:'🍪', name:'拿出來', unit:'單元1 10以內的數', concept:'看到數字→拿出那麼多',
    make:()=>range(1,5).map(genTake),
    tip:'說一個數字請他拿出來（湯匙、餅乾、積木），拿完再一起點數一次對不對。' },
  { id:'seq', em:'🔢', name:'數字排隊', unit:'單元3 排順序、比多少', concept:'1～10 的順序、比大小',
    make:()=>shuffle([genSeq('seq'),genSeq('seq'),genSeq('seq'),genSeq('cmp'),genSeq('cmp')]),
    tip:'上下樓梯一起數 1～10，也倒著數 10～1；問他「6 和 8 哪個大？」。' },
  { id:'ord', em:'🐶', name:'第幾個', unit:'單元3 排順序、比多少', concept:'從左／右數第幾個',
    make:()=>range(1,5).map(genOrd),
    tip:'先確認哪隻是右手；排玩具、排隊時問「從左邊數第 3 個是誰？」。' },
  { id:'more', em:'🐰', name:'比多少', unit:'單元3 排順序、比多少', concept:'誰比較多、多幾個',
    make:()=>shuffle([genMore('which'),genMore('which'),genMore('diff'),genMore('diff'),genMore('diff')]),
    tip:'兩排東西一個對一個排好，看「多出來、沒有配對的」有幾個。' },
  { id:'bean', em:'🥤', name:'藏豆子', unit:'單元4 分與合', concept:'5～10 分成兩堆（分與合）',
    make:()=>range(1,5).map(genBean),
    tip:'玩藏豆子：拿 7 顆豆子，手藏一些，讓他看外面剩幾顆、猜手裡有幾顆；每天換數字 5～10。' },
  { id:'len', em:'📏', name:'比長短', unit:'單元2 比長短', concept:'一端對齊再比長短',
    make:()=>shuffle([genLen('long'),genLen('long'),genLen('long'),genLen('fair'),genLen('fair')]),
    tip:'比鉛筆、比筷子：先把一端對齊，再看另一端誰比較遠。' },
  { id:'shape', em:'⚽', name:'滾滾疊疊', unit:'單元5 方盒、圓罐、球', concept:'會滾／會疊、平面和曲面',
    make:()=>sample(range(0,5),5).map(genShape),
    tip:'家裡找盒子、罐子、球，讓他自己試試看哪個會滾、哪個能疊。' },
];

/* ========== 首頁 ========== */
function drawHome(){
  $('lvGrid').innerHTML = LEVELS.map((L,i)=>{
    const r=cur.levels[L.id]; const done = r && r.done>=5;
    return `<button class="lv-card" data-i="${i}"><span class="no">第${i+1}關</span>${done?'<span class="ok">⭐</span>':''}
      <div class="em">${L.em}</div><div class="nm">${L.name}</div></button>`;
  }).join('');
  document.querySelectorAll('.lv-card').forEach(b=>b.onclick=()=>{ allMode=false; startLevel(+b.dataset.i); });
}
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===id)); window.scrollTo(0,0); }

/* ========== 遊戲流程 ========== */
let allMode=false, li=0, qs=[], qi=0, tries=0, rec=null, busy=false;

function startLevel(i){
  li=i; const L=LEVELS[i]; qs=L.make(); qi=0;
  rec = cur.levels[L.id] = { first:0, done:0, wrong:[] }; saveAll(sessions);
  $('lvName').textContent = `第${i+1}關 ${L.name}`;
  show('game'); showQ();
}
function drawDots(){ $('dots').innerHTML = qs.map((_,i)=>`<span class="${i<qi?'done':''}"></span>`).join(''); }

function showQ(){
  const q=qs[qi]; tries=0; busy=false;
  drawDots();
  $('promptTxt').innerHTML=q.prompt; $('fb').textContent=''; $('fb').className='feedback';
  const stage=$('stage'); stage.className = q.ord?'ord':(q.shapes?'shapes':''); stage.innerHTML='';
  if(q.custom){ buildTake(q, stage, v=>answer(v,null)); say(q.speech); return; }
  const vis=document.createElement('div'); vis.className='visual'; vis.innerHTML=q.visual;
  if(q.visual) stage.appendChild(vis);
  const opts=document.createElement('div'); opts.className='opts';
  opts.style.gridTemplateColumns=`repeat(${q.cols},1fr)`;
  q.options.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'+(q.len?' lenopt':'')+(q.big?' bigopt':'');
    if(q.big) { b.style.fontSize='44px'; b.style.minHeight='90px'; }
    if(o.html){ b.innerHTML=o.label; if(!q.len) b.style.fontSize='18px'; } else b.textContent=o.label;
    b.dataset.v=o.value; b.onclick=()=>answer(o.value,b);
    opts.appendChild(b);
  });
  stage.appendChild(opts);
  q.showAnswer=()=>{ [...opts.children].forEach(b=>{ if(String(b.dataset.v)===String(q.answer)) b.classList.add('right'); }); };
  if(q.bean){ stage.classList.add('lock'); buildBean(q, stage, ()=>stage.classList.remove('lock')); }
  say(q.speech);
}

function answer(v, btn){
  if(busy) return;
  const q=qs[qi];
  if(String(v)===String(q.answer)){
    busy=true; if(tries===0) rec.first++;
    rec.done++; saveAll(sessions);
    if(btn) btn.classList.add('right');
    chime(); $('fb').className='feedback good'; $('fb').textContent=pick(['答對了！🎉','好棒！✨','你好厲害！👍']);
    say('答對了'); setTimeout(nextQ, 1100);
    return;
  }
  tries++;
  if(tries===1){
    rec.wrong.push(q.detail(v)); saveAll(sessions);
    if(btn) btn.classList.add('tried');
    $('fb').className='feedback soft'; $('fb').textContent='再想想看～慢慢來 💪'; say('再想想看，慢慢來');
    return;
  }
  // 第二次還沒對：示範答案，下一題
  busy=true; rec.done++; saveAll(sessions);
  if(btn) btn.classList.add('tried');
  q.showAnswer && q.showAnswer();
  $('fb').className='feedback show'; $('fb').textContent='看，答案在這裡！沒關係，我們下一題 😊';
  say('沒關係，我們看答案，下一題'); setTimeout(nextQ, 2600);
}

function nextQ(){
  qi++;
  if(qi<qs.length){ showQ(); return; }
  drawDots();
  const last = li===LEVELS.length-1;
  $('endTitle').textContent = `第${li+1}關 ${LEVELS[li].name} 完成！`;
  $('endMsg').textContent = last ? '8 關全部闖完了，你超棒！🏆' : pick(['你很認真喔！','越玩越厲害！','繼續加油！']);
  $('btnNext').style.display = last ? 'none' : '';
  $('btnNext').textContent = allMode ? '下一關 ➜' : `第${li+2}關 ${last?'':LEVELS[li+1].name} ➜`;
  say(`第${li+1}關完成，你很棒！`);
  show('end');
}

/* ========== 大人看結果 ========== */
function statusOf(r){
  if(!r || r.done===0) return ['s-none','—未玩'];
  const p=r.first/r.done;
  if(p>=0.8) return ['s-ok','✅會了'];
  if(p>=0.4) return ['s-mid','⚠️不穩'];
  return ['s-bad','❌要補'];
}
const PRIORITY=['count','take','bean','seq','more','ord','len','shape'];
function fmtTime(t){ const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

function drawReport(s){
  const played = LEVELS.filter(L=>s.levels[L.id] && s.levels[L.id].done>0);
  const rows = LEVELS.map((L,i)=>{
    const r=s.levels[L.id]; const [cls,st]=statusOf(r);
    const sc = r && r.done ? `${r.first}/${r.done}` : '';
    const wr = r && r.wrong.length ? r.wrong.slice(0,2).join('<br>') : (r&&r.done?'—':'');
    return `<tr class="${cls}"><td class="st">${st}</td><td><span class="u">${L.unit}</span>${i+1}. ${L.name}：${L.concept}</td><td class="sc">${sc}</td><td class="wr">${wr}</td></tr>`;
  }).join('');
  let focus;
  const weak = played.map(L=>({L, p:s.levels[L.id].first/s.levels[L.id].done}))
    .filter(x=>x.p<0.8)
    .sort((a,b)=> a.p-b.p || PRIORITY.indexOf(a.L.id)-PRIORITY.indexOf(b.L.id));
  if(!played.length) focus='還沒有玩過任何一關。';
  else if(!weak.length) focus='<b>玩過的關卡都會了！</b> 可以再玩「湊十大挑戰」，或把沒玩的關卡玩完。';
  else focus=`<b>最該先補：${weak[0].L.name}（${weak[0].L.unit}）</b><br>在家這樣玩：${weak[0].L.tip}`;
  $('rpBody').innerHTML = `
    <div class="rp-head"><div class="sun"><img src="logo.png" alt=""></div><h2>一年級數感闖關 · 結果<small>${fmtTime(s.start)}　玩了 ${played.length}/8 關　（答對＝第一次就答對）</small></h2></div>
    <table class="rp"><tr><th>狀態</th><th>單元／觀念</th><th>答對</th><th>錯在哪</th></tr>${rows}</table>
    <div class="rp-focus">${focus}</div>
    <div class="rp-note">錯了沒關係，陪他再試一次就好 😊　—— SUNNY 魔法數學</div>`;
  $('hist').innerHTML = sessions.length>1 ? '<b>以前的紀錄（點一下看）</b>' + sessions.slice().reverse().map((x,k)=>{
    const idx=sessions.length-1-k;
    const icons=LEVELS.map(L=>statusOf(x.levels[L.id])[1].slice(0,1)).join('');
    return `<div class="${x===s?'cur':''}" data-k="${idx}">${fmtTime(x.start)}　${icons}</div>`; }).join('') : '';
  document.querySelectorAll('#hist div[data-k]').forEach(d=>d.onclick=()=>drawReport(sessions[+d.dataset.k]));
}

/* ========== 按鈕 ========== */
$('btnAll').onclick=()=>{ allMode=true; const next=LEVELS.findIndex(L=>!(cur.levels[L.id] && cur.levels[L.id].done>=5)); startLevel(next<0?0:next); };
$('btnSpk').onclick=()=>say(qs[qi].speech);
$('btnQuit').onclick=()=>{ speechSynthesis && speechSynthesis.cancel(); drawHome(); show('home'); };
$('btnNext').onclick=()=>startLevel(li+1);
$('btnEndHome').onclick=()=>{ drawHome(); show('home'); };
$('btnAdult').onclick=()=>{ drawReport(cur); show('report'); };
$('btnRpHome').onclick=()=>{ drawHome(); show('home'); };
$('btnNewSess').onclick=()=>{ if(confirm('要開始新的一次測驗嗎？（舊的紀錄會保留在下面）')){ newSession(); drawHome(); show('home'); } };
drawHome();
</script>
